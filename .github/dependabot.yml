version: 2
updates:
- package-ecosystem: "npm"
  directory: "/"
  schedule:
    interval: "daily"
  commit-message:
    prefix: "chore(deps)"
    include: "scope"
  labels:
  - "dependencies"
  - "javascript"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "daily"
  commit-message:
    prefix: "ci"
  labels:
  - "github-actions"
  - "automation"

- package-ecosystem: "docker"
  directory: "/"
  schedule:
    interval: "monthly"
  ignore:
  - dependency-name: "*"
    update-types: [ "version-update:semver-major" ]
